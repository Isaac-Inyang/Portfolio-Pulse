name: yfinance ingestion automation

on:
    workflow_dispatch:

jobs:
  refresh-orders:
    runs-on: ubuntu-latest
    env:
       DSN: ${{ secrets.NEON_DSN}}

    steps:
     - name: Checkout repository
       uses: actions/checkout@v4

     - name: Set up Python
       uses: actions/setup-python@v5
       with:
          python-version: '3.11'

     - name: Install dbt and dependencies
       run: |
         pip install  psycopg2-binary yfinance pandas

     - name: Ingesting yfinance data into Neon
       run:
         python yfinance_data_ingest.py --dsn "${DSN}"


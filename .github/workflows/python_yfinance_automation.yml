name: yfinance ingestion and DBT automation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose the ingestion mode"
        required: true
        default: "daily"
        type: choice
        options:
          - historical
          - daily

  schedule:
    - cron: "10 20 * * 1-5" # Runs at 20:10 AM UTC (9:10 pm Nigerian Time WAT) from Monday to friday

jobs:
  yfinance_ingestion:
    runs-on: ubuntu-latest
    env:
       DSN: ${{ secrets.NEON_DSN }}

    steps:
     - name: Checkout repository
       uses: actions/checkout@v4

     - name: Set up Python
       uses: actions/setup-python@v5
       with:
          python-version: '3.11'

     - name: Install dependencies
       run: |
         pip install psycopg2-binary yfinance pandas

     - name: Ingesting yfinance data into Neon
       run: |
         MODE="${{ github.event.inputs.mode || 'daily' }}"
         python yfinance_data_ingest.py --dsn "${DSN}" --mode "${MODE}"

  dbt-setup:
    runs-on: ubuntu-latest
    needs: yfinance_ingestion
    defaults:
      run:
        working-directory: ./portfolio_pulse_dbt  # specifying the working directory
    steps:
     - name: Checkout repository
       uses: actions/checkout@v4

     - name: Set up Python
       uses: actions/setup-python@v5
       with:
          python-version: '3.11'
     - name: Install dbt and dependencies
       run: |
         pip install dbt-core dbt-postgres
         dbt deps

     - name: Create profiles.yml dynamically
       env:
         DB_HOST: ${{ secrets.NEON_HOST }}
         DB_USER: ${{ secrets.NEON_USER }}
         DB_PASSWORD: ${{ secrets.NEON_PASSWORD }}
         DB_NAME: ${{ secrets.NEON_DB }}
       run: |
         mkdir -p ~/.dbt
         cat << 'EOF' > ~/.dbt/profiles.yml
         portfolio_pulse_dbt:
           target: dev
           outputs:
             dev:
               type: postgres
               host: ${{ env.DB_HOST }}
               user: ${{ env.DB_USER }}
               password: ${{ env.DB_PASSWORD }}
               port: 5432
               dbname: ${{ env.DB_NAME }}
               schema: marts
               sslmode: require
               threads: 4
         EOF

     - name: Run/debug and test dbt models
       run: |
         dbt debug  # test connections
         dbt build  # runs after connection is established
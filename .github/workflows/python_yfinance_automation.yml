name: yfinance ingestion automation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose the ingestion mode"
        required: true
        default: "daily"
        type: choice
        options:
          - historical
          - daily

  schedule:
    - cron: "0 20 * * 1-5"

jobs:
  yfinance_ingestion:
    runs-on: ubuntu-latest
    env:
       DSN: ${{ secrets.NEON_DSN}}

    steps:
     - name: Checkout repository
       uses: actions/checkout@v4

     - name: Set up Python
       uses: actions/setup-python@v5
       with:
          python-version: '3.11'

     - name: Install dbt and dependencies
       run: |
         pip install  psycopg2-binary yfinance pandas

     - name: Ingesting yfinance data into Neon
       run:
         MODE="${{ inputs.mode || 'daily' }}"
         python yfinance_data_ingest.py --dsn "${DSN}" --mode "${MODE}"


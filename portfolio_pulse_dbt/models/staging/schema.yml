version: 2

models:
  - name: stg_yfinance_prices
    columns:
      - name: price_id
        description: "unique identifier for each price record"
        tests:
          - unique
          - not_null
  
  - name: stg_stock_transactions
    columns:
      - name: transaction_id
        description: "unique identifier for each stock transaction"
        tests:
          - unique
          - not_null
      - name: ticker
        description: "ticker symbol of the stock"
        tests:
          - not_null
      - name: transaction_date
        description: "date of the stock transaction"
        tests:
          - not_null
      - name: transaction_type
        description: "type of the stock transaction"
        tests:
          - not_null
      - name: shares
        description: "number of shares involved in the transaction"
        tests:
          - not_null
      - name: price_usd
        description: "price of the stock in USD"
        tests:
          - not_null
      - name: fx_rate_ngn
        description: "exchange rate from USD to Naira"
        tests:
          - not_null
  - name: stg_exchange_rates
    columns:
      - name: updated_at
        tests:
          - not_null
      - name: base_currency
        tests:
          - not_null
      - name: conversion_rate_ngn
        tests:
          - not_null